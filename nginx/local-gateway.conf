# Local stand-in for AWS API Gateway (docs/microservices-contract.md). Path-prefix routing to
# each independently-deployed service - the same scheme API Gateway uses in AWS, just on nginx.
# None of these path segments prefix-collide with each other, so plain `location /api/v1/x` is
# an unambiguous match (matches /api/v1/x and /api/v1/x/..., never /api/v1/xyz).
server {
    listen 8080;

    location /api/v1/local-auth {
        proxy_pass http://user-service:8081;
        proxy_set_header Host $host;
    }
    location /api/v1/users {
        proxy_pass http://user-service:8081;
        proxy_set_header Host $host;
    }
    location /api/v1/chapters {
        proxy_pass http://user-service:8081;
        proxy_set_header Host $host;
    }
    location /api/v1/me {
        proxy_pass http://user-service:8081;
        proxy_set_header Host $host;
    }
    location /api/v1/roles {
        proxy_pass http://user-service:8081;
        proxy_set_header Host $host;
    }
    location /api/v1/permissions {
        proxy_pass http://user-service:8081;
        proxy_set_header Host $host;
    }
    location /api/v1/menus {
        proxy_pass http://user-service:8081;
        proxy_set_header Host $host;
    }

    location /api/v1/families {
        proxy_pass http://family-service:8082;
        proxy_set_header Host $host;
    }

    location /api/v1/memberships {
        proxy_pass http://membership-service:8083;
        proxy_set_header Host $host;
    }

    location /api/v1/matrimony {
        proxy_pass http://matrimony-service:8084;
        proxy_set_header Host $host;
    }

    location /api/v1/events {
        proxy_pass http://event-service:8085;
        proxy_set_header Host $host;
    }

    location /api/v1/analytics {
        proxy_pass http://analytics-service:8086;
        proxy_set_header Host $host;
    }
}
