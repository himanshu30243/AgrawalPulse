# Dev: auto-sync + self-heal + prune, so every merge to main rolls out on its own - dev is
# meant to move fast, not gate on a human. Apply once: `kubectl apply -f argocd/application-dev.yaml -n argocd`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agrawalpulse-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: agrawalpulse
  source:
    repoURL: https://github.com/himanshu30243/AgrawalPulse.git
    targetRevision: main
    path: helm/agrawalpulse
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: agrawalpulse-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
