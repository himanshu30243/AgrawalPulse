services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agrawalpulse
      POSTGRES_USER: agrawalpulse
      POSTGRES_PASSWORD: agrawalpulse
    ports:
      - "5432:5432"
    volumes:
      - agrawalpulse_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrawalpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  localstack:
    image: localstack/localstack:latest
    environment:
      - SERVICES=s3,sns,ses,events
      - DEFAULT_REGION=ap-south-1
    ports:
      - "4566:4566"
    volumes:
      - agrawalpulse_localstack:/var/lib/localstack

  # --- Microservices (see docs/microservices-contract.md) ---
  # All six share the one Postgres instance/database (confirmed design choice: separate
  # services, shared DB — not schema-per-service). SPRING_DATASOURCE_* env vars override
  # whatever's in application-local.yml (OS env vars outrank profile-specific YAML in Spring's
  # property source order), which is what lets the same image run both via `mvn spring-boot:run`
  # on a host (localhost:5432) and here inside the compose network (postgres:5432) unchanged.
  user-service:
    build: { context: ./backend, dockerfile: user-service/Dockerfile }
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agrawalpulse
      SPRING_DATASOURCE_USERNAME: agrawalpulse
      SPRING_DATASOURCE_PASSWORD: agrawalpulse
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }

  family-service:
    build: { context: ./backend, dockerfile: family-service/Dockerfile }
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agrawalpulse
      SPRING_DATASOURCE_USERNAME: agrawalpulse
      SPRING_DATASOURCE_PASSWORD: agrawalpulse
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }

  membership-service:
    build: { context: ./backend, dockerfile: membership-service/Dockerfile }
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agrawalpulse
      SPRING_DATASOURCE_USERNAME: agrawalpulse
      SPRING_DATASOURCE_PASSWORD: agrawalpulse
      FAMILY_SERVICE_URL: http://family-service:8082
    ports: ["8083:8083"]
    depends_on:
      postgres: { condition: service_healthy }
      family-service: { condition: service_started }

  matrimony-service:
    build: { context: ./backend, dockerfile: matrimony-service/Dockerfile }
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agrawalpulse
      SPRING_DATASOURCE_USERNAME: agrawalpulse
      SPRING_DATASOURCE_PASSWORD: agrawalpulse
      FAMILY_SERVICE_URL: http://family-service:8082
    ports: ["8084:8084"]
    depends_on:
      postgres: { condition: service_healthy }
      family-service: { condition: service_started }

  event-service:
    build: { context: ./backend, dockerfile: event-service/Dockerfile }
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agrawalpulse
      SPRING_DATASOURCE_USERNAME: agrawalpulse
      SPRING_DATASOURCE_PASSWORD: agrawalpulse
      FAMILY_SERVICE_URL: http://family-service:8082
    ports: ["8085:8085"]
    depends_on:
      postgres: { condition: service_healthy }
      family-service: { condition: service_started }

  analytics-service:
    build: { context: ./backend, dockerfile: analytics-service/Dockerfile }
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agrawalpulse
      SPRING_DATASOURCE_USERNAME: agrawalpulse
      SPRING_DATASOURCE_PASSWORD: agrawalpulse
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    ports: ["8086:8086"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  # Local stand-in for API Gateway: path-routes one base URL (matches the frontend's existing
  # VITE_API_BASE_URL=http://localhost:8080 unchanged) across the six independently-deployed
  # services, exactly like API Gateway does in AWS. See docs/microservices-contract.md.
  api-gateway:
    image: nginx:alpine
    ports: ["8080:8080"]
    volumes:
      - ./nginx/local-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-service
      - family-service
      - membership-service
      - matrimony-service
      - event-service
      - analytics-service

volumes:
  agrawalpulse_postgres:
  agrawalpulse_localstack:
