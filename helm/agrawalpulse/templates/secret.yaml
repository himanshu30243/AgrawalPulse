# Placeholder Secret so the chart is deployable end-to-end out of the box. Real deployments
# should NOT let ArgoCD manage this object's data at all - swap it for a SealedSecret / an
# External Secrets Operator ExternalSecret / a manually-applied Secret excluded from Git, and
# remove this template. See helm/agrawalpulse/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: agrawalpulse-db-credentials
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "agrawalpulse.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.global.secrets.dbUsername | quote }}
  password: {{ .Values.global.secrets.dbPassword | quote }}
