input {
  tcp {
    port => 5000
    codec => json
    type => "microservice"
  }
}

filter {
  if [type] == "microservice" {
    # Extract service name from logger_name
    if [logger_name] {
      grok {
        match => { "logger_name" => "com\.agrawalpulse\.%{WORD:service}\..*" }
        add_tag => [ "grok_matched" ]
      }
    }

    # Parse timestamp
    date {
      match => [ "@timestamp", "ISO8601" ]
      target => "@timestamp"
    }

    # Extract trace context for easier querying
    if [mdc][traceId] {
      mutate {
        add_field => { "traceId" => "%{[mdc][traceId]}" }
      }
    }

    if [mdc][correlationId] {
      mutate {
        add_field => { "correlationId" => "%{[mdc][correlationId]}" }
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "agrawalpulse-%{[service]}-%{+YYYY.MM.dd}"
  }

  # Also output errors to a separate index for easier alerting
  if [level] == "ERROR" or [level] == "FATAL" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "agrawalpulse-errors-%{+YYYY.MM.dd}"
    }
  }
}
