# local profile: laptop development, no AWS account required.
# Cognito is replaced by the local JWT issuer in security.local (see LocalJwtConfig) -
# it must NEVER be wired into any other profile.
spring:
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    compatibility-verifier:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/agrawalpulse
    username: agrawalpulse
    password: agrawalpulse
  data:
    redis:
      host: localhost
      port: 6379

agrawalpulse:
  jwt:
    local:
      # Dev-only symmetric signing secret. Must match the other services' local secret so a
      # token minted by any one service's /api/v1/local-auth/token is accepted by all of them -
      # never reused outside the local profile, never sourced from a real secret store.
      secret: ${LOCAL_JWT_SECRET:local-dev-only-signing-secret-change-me-1234567890}
      issuer: agrawalpulse-local
      token-ttl-minutes: 120

logging:
  level:
    com.agrawalpulse: DEBUG
    org.springframework: INFO

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
  retry:
    configs:
      default:
        maxAttempts: 2
        waitDuration: 100ms
  timelimiter:
    configs:
      default:
        timeoutDuration: 5000ms

# Local profile uses ConcurrentMapCacheManager (see CacheConfig), not Redis - but the Redis
# health indicator still auto-configures from spring-data-redis being on the classpath and
# reports the whole service DOWN when nothing is listening on 6379. Disable it here only.
management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,retries,timelimiters
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
