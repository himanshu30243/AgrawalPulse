spring:
  application:
    name: config-server
  profiles:
    # Local dev: serve config from local filesystem/classpath instead of Git.
    # Switch to a "git" profile (with server.git.uri set) for production.
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config-repo

server:
  port: 8888

logging:
  level:
    root: INFO
    org.springframework.cloud.config: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
