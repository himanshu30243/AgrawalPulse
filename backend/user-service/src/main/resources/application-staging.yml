# staging profile: pre-prod AWS account/namespace, same shape as prod, sized down.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:agrawalpulse}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${COGNITO_JWK_SET_URI}
          issuer-uri: ${COGNITO_ISSUER_URI:}

logging:
  level:
    com.agrawalpulse: INFO
