# local profile: laptop development, no AWS account required.
# Cognito is replaced by the local JWT issuer in common's security.local package (see
# LocalJwtConfig) - it must NEVER be wired into any other profile.
spring:
  datasource:
    # Same shared Postgres instance every service points at locally (docker-compose.yml) -
    # family-service only ever touches its own families/family_members tables in it.
    url: jdbc:postgresql://localhost:5432/agrawalpulse
    username: agrawalpulse
    password: agrawalpulse
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  cloud:
    sleuth:
      enabled: true
      trace-id128: false
      web:
        skip-pattern: "^(?!.*actuator).*$|.+\\.js|.+\\.css|.*\\.png"

agrawalpulse:
  jwt:
    local:
      # Dev-only symmetric signing secret. Never reused outside the local profile,
      # never sourced from a real secret store.
      secret: ${LOCAL_JWT_SECRET:local-dev-only-signing-secret-change-me-1234567890}
      issuer: agrawalpulse-local
      token-ttl-minutes: 120
  aws:
    endpoint-override: ${AWS_ENDPOINT_URL:http://localhost:4566}

logging:
  level:
    com.agrawalpulse: DEBUG
    org.springframework: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%-5level] %logger{36} - %msg%n"

# Resilience4j: circuit breaker, retry, timeout for inter-service calls
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    configs:
      default:
        maxAttempts: 2
        waitDuration: 100ms
  timelimiter:
    configs:
      default:
        timeoutDuration: 5000ms
        cancelRunningFuture: true
    instances:
      user-service:
        timeoutDuration: 3000ms

# Actuator: expose health check & metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,retries,timelimiters
  endpoint:
    health:
      show-details: always
