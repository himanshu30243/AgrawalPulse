# dev profile: AWS dev account. All infra endpoints and secrets come from the environment
# (ECS task definition / Secrets Manager injected env vars) - nothing hardcoded here.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:agrawalpulse}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${COGNITO_JWK_SET_URI}
          issuer-uri: ${COGNITO_ISSUER_URI:}

agrawalpulse:
  services:
    family-service:
      base-url: ${FAMILY_SERVICE_URL}

logging:
  level:
    com.agrawalpulse: INFO
